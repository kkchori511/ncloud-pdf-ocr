name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Backend tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python tests/run_all.py

      - name: Version info
        shell: pwsh
        run: |
          $ver = python packaging/make_version_info.py
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$ver") {
            Write-Error "태그($env:GITHUB_REF_NAME)와 앱 버전(v$ver)이 다릅니다."; exit 1
          }

      - name: Build executable
        run: pyinstaller packaging/akpil.spec

      - name: Smoke test executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/악필교정기.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { Write-Error "exe 자체 시험 실패"; exit 1 }

      - name: Update swap test (rename running exe, relaunch, cleanup)
        shell: pwsh
        run: |
          $w = Join-Path $pwd "swaptest"
          New-Item -ItemType Directory -Force $w | Out-Null
          $exe = Join-Path $w "악필교정기.exe"
          $new = "$exe.new"
          $out = Join-Path $w "swap.txt"
          Copy-Item "dist/악필교정기.exe" $exe
          Copy-Item "dist/악필교정기.exe" $new
          "stale" | Set-Content (Join-Path $w "악필교정기.exe.old")
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest-swap", "`"$new`"", "`"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $out -ErrorAction SilentlyContinue; Write-Error "교체 실패"; exit 1 }
          for ($i = 0; $i -lt 120 -and -not (Test-Path $out); $i++) { Start-Sleep -Milliseconds 500 }
          for ($i = 0; $i -lt 60 -and -not ((Get-Content $out -Raw -ErrorAction SilentlyContinue) -match "leftovers cleaned"); $i++) { Start-Sleep -Milliseconds 500 }
          Start-Sleep -Seconds 2
          Get-Content $out
          Get-ChildItem $w | Format-Table Name, Length
          $txt = Get-Content $out -Raw
          if ($txt -notmatch "pdfium OK" -or $txt -notmatch "leftovers cleaned: .*\.old") { Write-Error "새 exe 실행·정리 실패"; exit 1 }
          if (Test-Path $new) { Write-Error ".new가 남음"; exit 1 }
          if (Get-ChildItem $w -Filter "*.old") { Write-Error ".old가 남음"; exit 1 }
          if (-not (Test-Path $exe)) { Write-Error "exe가 없음"; exit 1 }

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: akpil-windows
          path: dist/악필교정기.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download executable
        uses: actions/download-artifact@v8
        with:
          name: akpil-windows
          path: dist

      - name: Attach executable to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "$env:GH_REPO"
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --repo "$env:GH_REPO" --title "악필교정기 $env:RELEASE_TAG" --generate-notes --verify-tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # Release 파일 이름은 영문으로 둔다(한글이면 GitHub가 default.exe로 바꾼다). 갤러리가 latest/download/Akpil.exe로 연결한다.
          # 앱의 자동 업데이트도 이 이름(Akpil.exe)과 GitHub가 붙여 주는 SHA-256(digest)을 쓴다.
          Copy-Item "dist/악필교정기.exe" "dist/Akpil.exe"
          gh release upload "$env:RELEASE_TAG" "dist/Akpil.exe" --repo "$env:GH_REPO" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  pages:
    # 내려받기 페이지 + 예비 경로: 같은 exe를 gh-pages 브랜치(GitHub Pages)에 최신 1개만 올린다.
    # 일부 학교·통신사 망은 GitHub 릴리스 파일 서버를 막아서, 앱 업데이트도 여기서 다시 받는다(SHA-256으로 확인).
    # 기록을 매번 덮어써 저장소가 커지지 않게 한다.
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download executable
        uses: actions/download-artifact@v8
        with:
          name: akpil-windows
          path: dist

      - name: Publish to gh-pages
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -e
          ver="${TAG#v}"
          mkdir out
          cp "dist/악필교정기.exe" "out/Akpil-$ver.exe"
          cp site/face.png out/
          sed "s/__VERSION__/$ver/g" site/index.html > out/index.html
          touch out/.nojekyll
          sha256sum "out/Akpil-$ver.exe"
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "pages $TAG"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
